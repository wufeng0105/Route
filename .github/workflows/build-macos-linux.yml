name: macOS + Linux 打包测试

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - 'frontend/**'
      - '.github/workflows/build-macos-linux.yml'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            artifact: Route.app
          - os: ubuntu-22.04
            platform: Linux
            artifact: Route.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file xvfb

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ============ 编译 ============
      - name: Build release
        working-directory: src-tauri
        run: npx tauri build 2>&1

      # ============ 检查产物 ============
      - name: Check macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          echo "=== 查找 .app 产物 ==="
          find target/release/bundle -name "*.app" -type d 2>/dev/null || echo "未找到 .app"
          APP_PATH=$(find target/release/bundle -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "✓ 找到: $APP_PATH"
            echo ""
            echo "=== .app 结构 ==="
            find "$APP_PATH" -type f | head -20
            echo ""
            echo "=== Info.plist ==="
            cat "$APP_PATH/Contents/Info.plist" 2>/dev/null | head -30
            echo ""
            echo "=== 可执行文件 ==="
            ls -la "$APP_PATH/Contents/MacOS/" 2>/dev/null
          else
            echo "✗ 未找到 .app 产物"
            exit 1
          fi

      - name: Check Linux AppImage
        if: runner.os == 'Linux'
        run: |
          echo "=== 查找 AppImage 产物 ==="
          find target/release/bundle -name "*.AppImage" -type f 2>/dev/null || echo "未找到 AppImage"
          APPIMG_PATH=$(find target/release/bundle -name "*.AppImage" -type f | head -1)
          if [ -n "$APPIMG_PATH" ]; then
            echo "✓ 找到: $APPIMG_PATH"
            ls -lh "$APPIMG_PATH"
            file "$APPIMG_PATH"
          else
            echo "✗ 未找到 AppImage"
            echo "=== 检查是否有 raw binary ==="
            ls -lh target/release/route 2>/dev/null || ls -lh target/release/app 2>/dev/null || echo "无 binary"
            exit 1
          fi

      # ============ 运行测试 ============
      - name: Test macOS app launch
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find target/release/bundle -name "*.app" -type d | head -1)
          echo "=== 启动 $APP_PATH ==="
          open "$APP_PATH" &
          sleep 5
          # 检查进程是否存活
          PID=$(pgrep -f "Route" | head -1)
          if [ -n "$PID" ]; then
            echo "✓ 应用启动成功 (PID: $PID)"
            # 截图（可选）
            screencapture -x /tmp/route_screenshot.png 2>/dev/null && echo "✓ 截图已保存" || true
            # 关闭应用
            kill $PID 2>/dev/null || true
          else
            echo "✗ 应用启动失败"
            # 尝试直接运行 binary
            echo "=== 尝试直接运行 binary ==="
            "$APP_PATH/Contents/MacOS/route" --version 2>&1 || true
          fi

      - name: Test Linux app launch (xvfb)
        if: runner.os == 'Linux'
        run: |
          APPIMG_PATH=$(find target/release/bundle -name "*.AppImage" -type f | head -1)
          if [ -n "$APPIMG_PATH" ]; then
            chmod +x "$APPIMG_PATH"
            echo "=== 通过 xvfb 启动 AppImage ==="
            timeout 10 xvfb-run "$APPIMG_PATH" &
            sleep 5
            PID=$(pgrep -f "route" | head -1)
            if [ -n "$PID" ]; then
              echo "✓ 应用启动成功 (PID: $PID)"
              kill $PID 2>/dev/null || true
            else
              echo "⚠ 应用可能未启动（GUI 应用在 headless 环境可能无法运行）"
            fi
          else
            echo "=== 尝试运行 raw binary ==="
            timeout 10 xvfb-run ./target/release/route &
            sleep 5
            PID=$(pgrep -f "route" | head -1)
            if [ -n "$PID" ]; then
              echo "✓ binary 启动成功 (PID: $PID)"
              kill $PID 2>/dev/null || true
            else
              echo "⚠ binary 在 headless 环境可能无法运行"
            fi
          fi

      # ============ 上传产物 ============
      - name: Upload macOS .app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Route-macOS
          path: target/release/bundle/macos/*.app

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Route-Linux
          path: target/release/bundle/appimage/*.AppImage
